<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devcon Web Terminal</title>
    <link rel="stylesheet" href="/vendor/xterm/xterm.css?v=20260528c" />
    <link rel="stylesheet" href="/styles.css?v=20260528c" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <h1>Devcon</h1>
        </div>
        <p id="status" class="status">Connecting...</p>
      </header>

      <section id="auth-card" class="card hidden">
        <h2>Unlock Session</h2>
        <p>This server requires a password.</p>
        <div class="row">
          <input
            id="password-input"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
          />
          <button id="login-btn">Unlock</button>
        </div>
      </section>

      <section id="terminal-wrap" class="terminal-wrap hidden">
        <div class="toolbar">
          <button id="paste-btn" title="Paste clipboard">Paste</button>
          <button id="ctrlc-btn" title="Send Ctrl+C">^C</button>
          <button id="clear-btn" title="Clear visible terminal">Clear</button>
          <button id="reconnect-btn" title="Reconnect websocket">Retry</button>
          <button id="arrow-up-btn" class="mobile-arrow hidden-desktop" title="Arrow up">Up</button>
          <button id="arrow-down-btn" class="mobile-arrow hidden-desktop" title="Arrow down">Dn</button>
          <button id="arrow-left-btn" class="mobile-arrow hidden-desktop" title="Arrow left">Lt</button>
          <button id="arrow-right-btn" class="mobile-arrow hidden-desktop" title="Arrow right">Rt</button>
        </div>
        <div class="terminal-shell">
          <div id="terminal" class="terminal"></div>
          <aside class="mobile-rail" aria-label="Mobile terminal controls">
            <button id="scroll-up-btn" class="mobile-btn" title="Scroll up">˄</button>
            <button id="scroll-down-btn" class="mobile-btn" title="Scroll down">˅</button>
          </aside>
        </div>
      </section>
    </main>

    <script src="/vendor/xterm/xterm.js?v=20260528c"></script>
    <script src="/vendor/xterm-addon-fit/addon-fit.js?v=20260528c"></script>
    <script src="/app.js?v=20260528c"></script>
  </body>
</html>
